name: Windows desktop preview
on:
  push:
    branches: [main, codex/windows-preview]
    paths: ['desktop/**', 'android/app/src/**', '.github/workflows/windows-desktop.yml', '.github/scripts/windows-checks.ps1']
  pull_request:
    paths: ['desktop/**', 'android/app/src/**', '.github/workflows/windows-desktop.yml', '.github/scripts/windows-checks.ps1']
  workflow_dispatch:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      STEP_SYNC_URL: ${{ vars.STEP_SYNC_URL }}
      STEP_SYNC_PUBLIC_KEY: ${{ vars.STEP_SYNC_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            desktop/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Prepare public client configuration
        run: python desktop/configure.py --required
      - name: Locate WiX packaging tools
        shell: pwsh
        run: |
          $candidate = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' | Select-Object -First 1
          if ($candidate) { Join-Path $candidate.FullName 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append }
          elseif (!(Get-Command candle.exe -ErrorAction SilentlyContinue)) { choco install wixtoolset --version=3.14.1 --yes --no-progress }
      - name: Test and build native Windows installers
        shell: pwsh
        run: .\android\gradlew.bat -p desktop --no-daemon :core:test :app:test :app:createDistributable :app:packageExe :app:packageMsi
      - name: Build reviewed prior installer
        timeout-minutes: 8
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'step-upgrade-baseline'
          git fetch --depth=1 origin 8812ac7fa315880374a6332a65ecf755e106d599
          if ($LASTEXITCODE -ne 0) { throw 'Could not obtain reviewed upgrade baseline' }
          git worktree add --detach $baseline FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare isolated upgrade baseline' }
          python "$baseline\desktop\configure.py" --required
          & "$baseline\android\gradlew.bat" -p "$baseline\desktop" --no-daemon :app:packageMsi
          if ($LASTEXITCODE -ne 0) { throw 'Could not build prior Windows preview' }
      - name: Install prior version and create fictional data
        timeout-minutes: 6
        shell: pwsh
        run: |
          . .github/scripts/windows-checks.ps1
          $baseline = Join-Path $env:RUNNER_TEMP 'step-upgrade-baseline'
          $oldMsi = Get-ChildItem "$baseline\desktop\app\build\compose\binaries\main\msi\*.msi" | Select-Object -First 1
          $code = Invoke-StepCheckProcess msiexec.exe @('/i', $oldMsi.FullName, '/qn', '/norestart', '/l*v', "$env:RUNNER_TEMP\step-prior-install.log") 'step-prior-install' 180
          if ($code -notin @(0,3010)) { throw "Prior install failed: $code" }
          $upgradeData = Join-Path $env:RUNNER_TEMP 'step-upgrade-fixture'
          $code = Invoke-StepCheckProcess (Get-StepInstalledExecutable) @('--self-test','--data-dir',"`"$upgradeData`"") 'step-prior-fixture'
          if ($code -ne 0) { throw "Prior fixture failed: $code" }
          (Get-FileHash "$upgradeData\sync-state.json" -Algorithm SHA256).Hash | Set-Content "$env:RUNNER_TEMP\step-before-hash.txt"
      - name: Upgrade and verify preserved data
        timeout-minutes: 6
        shell: pwsh
        run: |
          . .github/scripts/windows-checks.ps1
          $msi = Get-ChildItem desktop/app/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          if (!$msi) { throw 'MSI was not produced' }
          $code = Invoke-StepCheckProcess msiexec.exe @('/i', $msi.FullName, '/qn', '/norestart', '/l*v', "$env:RUNNER_TEMP\step-install.log") 'step-upgrade-install' 180
          if ($code -notin @(0,3010)) { throw "Upgrade install failed: $code" }
          $upgradeData = Join-Path $env:RUNNER_TEMP 'step-upgrade-fixture'
          $before = (Get-Content "$env:RUNNER_TEMP\step-before-hash.txt").Trim()
          if ($before -ne (Get-FileHash "$upgradeData\sync-state.json" -Algorithm SHA256).Hash) { throw 'Installer changed existing user data' }
          $code = Invoke-StepCheckProcess (Get-StepInstalledExecutable) @('--upgrade-self-test','--data-dir',"`"$upgradeData`"") 'step-upgrade-fixture'
          if ($code -ne 0 -or !(Test-Path "$upgradeData\upgrade-self-test.json")) { throw 'Upgrade preservation verification failed' }
          Get-Content "$upgradeData\upgrade-self-test.json"
      - name: Verify new install and native Windows registrations
        timeout-minutes: 6
        shell: pwsh
        run: |
          . .github/scripts/windows-checks.ps1
          $data = Join-Path $env:RUNNER_TEMP 'step-packaged-smoke'
          $code = Invoke-StepCheckProcess (Get-StepInstalledExecutable) @('--self-test','--data-dir',"`"$data`"") 'step-smoke'
          if ($code -ne 0 -or !(Test-Path "$data\smoke-result.json")) { throw 'Installed executable smoke test failed' }
          Get-Content "$data\smoke-result.json"
          $systemData = Join-Path $env:RUNNER_TEMP 'step-system-fixture'
          $code = Invoke-StepCheckProcess (Get-StepInstalledExecutable) @('--system-self-test','--data-dir',"`"$systemData`"") 'step-system' 180
          if ($code -ne 0 -or !(Test-Path "$systemData\system-self-test.json")) { throw 'Windows integration verification failed' }
          Get-Content "$systemData\system-self-test.json"
      - name: Remove fixture installation
        if: always()
        timeout-minutes: 4
        shell: pwsh
        run: |
          . .github/scripts/windows-checks.ps1
          $msi = Get-ChildItem desktop/app/build/compose/binaries/main/msi/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) { Invoke-StepCheckProcess msiexec.exe @('/x', $msi.FullName, '/qn', '/norestart') 'step-uninstall' 180 | Out-Null }
      - name: Prepare portable build and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/artifacts | Out-Null
          Copy-Item desktop/app/build/compose/binaries/main/exe/*.exe desktop/artifacts/
          Copy-Item desktop/app/build/compose/binaries/main/msi/*.msi desktop/artifacts/
          Compress-Archive -Path desktop/app/build/compose/binaries/main/app/Step -DestinationPath desktop/artifacts/Step-0.2.1-windows-x64-portable.zip
          Get-ChildItem desktop/artifacts -File | ForEach-Object { $h=Get-FileHash $_.FullName -Algorithm SHA256; "$($h.Hash.ToLower())  $($_.Name)" } | Set-Content desktop/artifacts/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Step-0.2.1-windows-x64
          path: desktop/artifacts/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-verification
          path: |
            desktop/core/build/reports/tests/
            desktop/app/build/reports/tests/
            desktop/app/build/test-results/
            desktop/app/build/test-screenshots/
            ${{ runner.temp }}/step-*.log
            ${{ runner.temp }}/step-packaged-smoke/smoke-result.json
            ${{ runner.temp }}/step-upgrade-fixture/upgrade-self-test.json
            ${{ runner.temp }}/step-system-fixture/system-self-test.json
            ${{ runner.temp }}/step-system-out.log
            ${{ runner.temp }}/step-system-error.log
