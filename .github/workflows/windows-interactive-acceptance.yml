name: Windows interactive acceptance
on:
  push:
    branches: [codex/windows-preview]
    paths:
      - '.github/workflows/windows-interactive-acceptance.yml'
      - '.github/scripts/windows-interactive-*'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-interactive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify accepted artifact identity
        shell: pwsh
        run: |
          $run = gh api repos/Zita-Go/Pare/actions/runs/45035586093 | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.head_sha -ne '71deb0d98cad2fd706fb8ffc8dab8a1056ba4d4e') { throw 'Accepted source/build changed' }
          $artifact = gh api repos/Zita-Go/Pare/actions/artifacts/14759747938 | ConvertFrom-Json
          if ($artifact.expired -or $artifact.digest -ne 'sha256:950daac5823e6be38d9c750d0570aa45f232306dd3c794c956c24ab02039727e') { throw 'Accepted artifact changed' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14759747938'
          run-id: '45035586093'
          github-token: ${{ github.token }}
          repository: Zita-Go/Pare
          path: packages
          merge-multiple: true
      - name: Verify each installer checksum
        shell: pwsh
        run: |
          $expectedNames = @('Step-0.2.0.exe','Step-0.2.0.msi','Step-0.2.0-windows-x64-portable.zip')
          $seen = @()
          foreach ($line in Get-Content packages/SHA256SUMS.txt) {
            if ($line -notmatch '^([0-9a-f]{64})  ([^\\/]+)$') { throw 'Invalid checksum entry' }
            $hash=$Matches[1]; $name=$Matches[2]
            if ($name -notin $expectedNames -or $name -in $seen) { throw 'Unexpected or duplicate asset' }
            if ((Get-FileHash (Join-Path packages $name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw 'Installer checksum mismatch' }
            $seen += $name
          }
          if ($seen.Count -ne 3) { throw 'Missing installer checksums' }
      - name: Parse native acceptance script
        shell: pwsh
        run: |
          $tokens=$null; $issues=$null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path .github/scripts/windows-interactive-acceptance.ps1),[ref]$tokens,[ref]$issues) | Out-Null
          if ($issues.Count) { $issues | Format-List; throw 'Acceptance script parse failed' }
      - name: Install accepted preview
        timeout-minutes: 4
        shell: pwsh
        run: |
          . .github/scripts/windows-checks.ps1
          $msi=(Resolve-Path packages/Step-0.2.0.msi).Path
          $code=Invoke-StepCheckProcess msiexec.exe @('/i',$msi,'/qn','/norestart') 'step-interactive-install' 180
          if ($code -notin @(0,3010)) { throw "Install failed: $code" }
      - name: Exercise actual installed desktop and final lock stage
        timeout-minutes: 10
        shell: pwsh
        run: |
          . .github/scripts/windows-checks.ps1
          $exe=Get-StepInstalledExecutable
          $profile=Join-Path $env:RUNNER_TEMP 'step-interactive-fictional-profile'
          $reports=Join-Path $env:RUNNER_TEMP 'step-interactive-reports'
          & .github/scripts/windows-interactive-acceptance.ps1 -Executable $exe -DataDirectory $profile -OutputDirectory $reports -AttemptLock
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance reported a failure; inspect the JSON' }
          Get-Content "$reports/interactive-acceptance.json"
      - name: Remove fixture installation
        if: always()
        timeout-minutes: 4
        shell: pwsh
        run: |
          . .github/scripts/windows-checks.ps1
          if (Test-Path packages/Step-0.2.0.msi) {
            $msi=(Resolve-Path packages/Step-0.2.0.msi).Path
            Invoke-StepCheckProcess msiexec.exe @('/x',$msi,'/qn','/norestart') 'step-interactive-uninstall' 180 | Out-Null
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-interactive-acceptance
          path: |
            ${{ runner.temp }}/step-interactive-reports/
            ${{ runner.temp }}/step-interactive-*.log
          if-no-files-found: warn
