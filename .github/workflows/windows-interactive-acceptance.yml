name: Windows interactive acceptance
on:
  push:
    branches: [codex/windows-preview]
    paths:
      - '.github/workflows/windows-interactive-acceptance.yml'
      - '.github/scripts/windows-interactive-*'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-interactive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify accepted artifact identity
        shell: pwsh
        run: |
          $run = gh api repos/Zita-Go/Pare/actions/runs/45417186016 | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.head_sha -ne '91b8d636e918b6003dfd4c174ca692c5e03e9ef8') { throw 'Accepted source/build changed' }
          $artifact = gh api repos/Zita-Go/Pare/actions/artifacts/14933182097 | ConvertFrom-Json
          if ($artifact.expired -or $artifact.digest -ne 'sha256:912ed9a6ed3262ee1e17482000aa5458a4cb622a36a82f15a97806b4ac660080') { throw 'Accepted artifact changed' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14933182097'
          run-id: '45417186016'
          github-token: ${{ github.token }}
          repository: Zita-Go/Pare
          path: packages
          merge-multiple: true
      - name: Verify each installer checksum
        shell: pwsh
        run: |
          $expectedNames = @('Step-0.3.0.exe','Step-0.3.0.msi','Step-0.3.0-windows-x64-portable.zip')
          $seen = @()
          foreach ($line in Get-Content packages/SHA256SUMS.txt) {
            if ($line -notmatch '^([0-9a-f]{64})  ([^\\/]+)$') { throw 'Invalid checksum entry' }
            $hash=$Matches[1]; $name=$Matches[2]
            if ($name -notin $expectedNames -or $name -in $seen) { throw 'Unexpected or duplicate asset' }
            if ((Get-FileHash (Join-Path packages $name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw 'Installer checksum mismatch' }
            $seen += $name
          }
          if ($seen.Count -ne 3) { throw 'Missing installer checksums' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14902437909'
          run-id: '45356191207'
          github-token: ${{ github.token }}
          repository: Zita-Go/Pare
          path: prior-packages
          merge-multiple: true
      - name: Parse native acceptance script
        shell: pwsh
        run: |
          $tokens=$null; $issues=$null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path .github/scripts/windows-interactive-acceptance.ps1),[ref]$tokens,[ref]$issues) | Out-Null
          if ($issues.Count) { $issues | Format-List; throw 'Acceptance script parse failed' }
      - name: Upgrade from the previous Windows 0.2.2
        timeout-minutes: 8
        shell: pwsh
        run: |
          . .github/scripts/windows-checks.ps1
          $line = Get-Content prior-packages/SHA256SUMS.txt | Where-Object { $_ -match '^([0-9a-f]{64})  Step-0[.]2[.]2[.]msi$' }
          if (!$line -or $line -notmatch '^([0-9a-f]{64})  Step-0[.]2[.]2[.]msi$') { throw 'Missing prior installer checksum' }
          if ((Get-FileHash prior-packages/Step-0.2.2.msi -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Matches[1]) { throw 'Prior installer checksum mismatch' }
          $prior=(Resolve-Path prior-packages/Step-0.2.2.msi).Path
          $code=Invoke-StepCheckProcess msiexec.exe @('/i',$prior,'/qn','/norestart') 'step-interactive-prior-install' 180
          if ($code -notin @(0,3010)) { throw "Prior install failed: $code" }
          $oldData=Join-Path $env:RUNNER_TEMP 'step-from-02-fixture'
          $code=Invoke-StepCheckProcess (Get-StepInstalledExecutable) @('--self-test','--data-dir',"`"$oldData`"") 'step-interactive-prior-fixture'
          if ($code -ne 0) { throw 'Prior fixture creation failed' }
          $msi=(Resolve-Path packages/Step-0.3.0.msi).Path
          $code=Invoke-StepCheckProcess msiexec.exe @('/i',$msi,'/qn','/norestart') 'step-interactive-install' 180
          if ($code -notin @(0,3010)) { throw "Install failed: $code" }
          $code=Invoke-StepCheckProcess (Get-StepInstalledExecutable) @('--upgrade-self-test','--data-dir',"`"$oldData`"") 'step-interactive-upgrade-fixture'
          if ($code -ne 0 -or !(Test-Path "$oldData/upgrade-self-test.json")) { throw '0.2.2 upgrade validation failed' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/step-interactive-reports" | Out-Null
          Copy-Item "$oldData/upgrade-self-test.json" "$env:RUNNER_TEMP/step-interactive-reports/from-0.2.2-upgrade.json"
      - name: Exercise actual installed desktop and final lock stage
        timeout-minutes: 10
        shell: pwsh
        run: |
          . .github/scripts/windows-checks.ps1
          $exe=Get-StepInstalledExecutable
          $stepQaProfile=Join-Path $env:RUNNER_TEMP 'step-interactive-fictional-profile'
          $reports=Join-Path $env:RUNNER_TEMP 'step-interactive-reports'
          & .github/scripts/windows-interactive-acceptance.ps1 -Executable $exe -DataDirectory $stepQaProfile -OutputDirectory $reports -AttemptLock
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance reported a failure; inspect the JSON' }
          Get-Content "$reports/interactive-acceptance.json"
      - name: Remove fixture installation
        if: always()
        timeout-minutes: 4
        shell: pwsh
        run: |
          . .github/scripts/windows-checks.ps1
          if (Test-Path packages/Step-0.3.0.msi) {
            $msi=(Resolve-Path packages/Step-0.3.0.msi).Path
            Invoke-StepCheckProcess msiexec.exe @('/x',$msi,'/qn','/norestart') 'step-interactive-uninstall' 180 | Out-Null
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-interactive-acceptance
          path: |
            ${{ runner.temp }}/step-interactive-reports/
            ${{ runner.temp }}/step-interactive-*.log
          if-no-files-found: warn
